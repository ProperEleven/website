<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P.E.T — Proper Eleven Technologies</title>
  <meta name="description" content="P.E.T — Proper Eleven Technologies. Building what moves humanity forward.">
  <meta name="theme-color" content="#070706">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070706'/%3E%3Crect x='8' y='6' width='5' height='20' fill='%23ff5a1f'/%3E%3Crect x='19' y='6' width='5' height='20' fill='%23ff5a1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --night:#070706; --ink:#f6f1e8; --muted:#9c948a; --ember:#ff5a1f; --line:#2a2622; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: Outfit, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--ember); color: var(--night); }
    :focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
    .stage { position: relative; height: 100dvh; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .veil { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 0%, rgba(7,7,6,.55) 55%, #070706 100%); }
    .center { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; }
    .kicker { margin: 0; color: var(--ember); letter-spacing: .28em; text-transform: uppercase; font-size: .75rem; font-weight: 500; }
    h1 { margin: 1.25rem 0 0; font-family: Syne, sans-serif; font-size: clamp(4rem, 14vw, 7.5rem); letter-spacing: -.04em; line-height: .9; }
    .rule { width: 4rem; height: 1px; margin: 1.5rem auto 0; background: var(--ember); transform-origin: left; }
    p.line { margin: 1.5rem 0 0; max-width: 22rem; font-size: clamp(1.15rem, 2.4vw, 1.5rem); line-height: 1.35; }
    .go { margin-top: 2.5rem; display: inline-flex; align-items: center; gap: .75rem; min-height: 2.75rem; padding: .75rem 1.25rem; border: 1px solid var(--line); font-size: .875rem; letter-spacing: .04em; transition: border-color .3s, color .3s; }
    .go:hover { border-color: var(--ember); color: var(--ember); }
    .legal a, .legal span { display: block; margin-top: .35rem; }
    .legal a:hover { color: var(--ink); }
    .dot { width: .4rem; height: .4rem; border-radius: 50%; background: var(--ember); animation: pulse 2.4s ease-in-out infinite; }
    .legal { position: absolute; left: 0; right: 0; bottom: 1.5rem; z-index: 1; margin: 0; text-align: center; color: var(--muted); font-size: .75rem; }
    .rise { animation: rise 1.1s cubic-bezier(.2,0,0,1) both; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes pulse { 50% { opacity: .4; transform: scale(1.4); } }
    @media (prefers-reduced-motion: reduce) { .rise, .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="veil"></div>
    <div class="center">
      <p class="kicker rise">Proper Eleven Technologies</p>
      <h1 class="rise d2">P.E.T</h1>
      <div class="rule rise d3"></div>
      <p class="line rise d4">Building what moves humanity forward.</p>
      <a class="go rise d4" href="https://sagazo.com" target="_blank"><span class="dot"></span>Sagazo ↗</a>
    </div>
    <p class="legal rise d4">Proper Eleven Technologies Private Limited<a href="mailto:contact@propereleven.com">contact@propereleven.com</a><span>From India</span></p>
  </main>
  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pointer = { x: .5, y: .42 };
    let nodes = [];
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(Math.min(110, canvas.clientWidth / 12));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - .5) * .00035, vy: (Math.random() - .5) * .00035,
        p: Math.random() * Math.PI * 2
      }));
    }
    function draw(t) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const breathe = reduce ? .5 : .5 + Math.sin(t * .00045) * .5;
      [0.5 - 0.045 - breathe * 0.01, 0.5 + 0.045 + breathe * 0.01].forEach((cx, i) => {
        const g = ctx.createLinearGradient(0, h * .18, 0, h * .82);
        g.addColorStop(0, "rgba(255,90,31,0)");
        g.addColorStop(.45, "rgba(255,90,31," + (.35 + breathe * .35) + ")");
        g.addColorStop(1, "rgba(255,90,31,0)");
        ctx.fillStyle = g;
        const width = 2 + i * .4 + breathe * 1.4;
        ctx.fillRect(cx * w - width / 2, h * .16, width, h * .68);
      });
      nodes.forEach((n) => {
        if (!reduce) {
          n.x += n.vx + Math.sin(t * .0003 + n.p) * .00008;
          n.y += n.vy + Math.cos(t * .00025 + n.p) * .00008;
          n.x += (pointer.x - .5) * .0004;
          n.y += (pointer.y - .5) * .0004;
          if (n.x < 0 || n.x > 1) n.vx *= -1;
          if (n.y < 0 || n.y > 1) n.vy *= -1;
          n.x = Math.min(1, Math.max(0, n.x));
          n.y = Math.min(1, Math.max(0, n.y));
        }
      });
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = (nodes[i].x - nodes[j].x) * w;
          const dy = (nodes[i].y - nodes[j].y) * h;
          const dist = Math.hypot(dx, dy);
          if (dist < 130) {
            ctx.strokeStyle = "rgba(246,241,232," + ((1 - dist / 130) * .16) + ")";
            ctx.beginPath();
            ctx.moveTo(nodes[i].x * w, nodes[i].y * h);
            ctx.lineTo(nodes[j].x * w, nodes[j].y * h);
            ctx.stroke();
          }
        }
      }
      nodes.forEach((n) => {
        ctx.fillStyle = "rgba(255,176,140,.75)";
        ctx.beginPath();
        ctx.arc(n.x * w, n.y * h, 1.3, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    addEventListener("pointermove", (e) => {
      const b = canvas.getBoundingClientRect();
      pointer.x = (e.clientX - b.left) / b.width;
      pointer.y = (e.clientY - b.top) / b.height;
    });
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
